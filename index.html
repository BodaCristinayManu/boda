<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Invitación</title>
  <meta name="theme-color" content="#f6f1e9" />
  <meta name="description" content="Tarjeta de invitación. Pulsa para ver los detalles de la boda." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Invitación" />
  <meta property="og:description" content="Pulsa para ver todos los detalles de la boda." />
  <meta property="og:image" content="img/invitacion.PNG" />
  <meta property="og:url" content="" />

  <!-- Precargar imágenes críticas -->
  <link rel="preload" as="image" href="img/carta.PNG" />
  <link rel="preload" as="image" href="img/invitacion.PNG" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet" />

  <style>
    :root{
      --maxw: 400px;
      --shadow: 0 20px 50px rgba(0,0,0,.18);
      --img-ratio: 3/4;
    }
    *{box-sizing:border-box}
    html,body{height:100%; overflow-x:hidden;}
    body{
      margin:0;
      display:grid;
      place-items:center;
      background: #ffffff;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#E9713F;
      -webkit-font-smoothing:antialiased; 
      -moz-osx-font-smoothing:grayscale;
    }
    
    /* --- PANTALLA INICIAL CON IMAGEN DE FONDO --- */
    #permission-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity .5s ease, visibility .5s ease;
      -webkit-tap-highlight-color: transparent;
      will-change: opacity;
      overflow: hidden;
    }
    
    /* Imagen de fondo */
    #permission-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('img/carta.PNG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      transform: scale(1.05); /* Ligero zoom para evitar bordes blancos */
    }
    
    /* Overlay oscuro opcional para mejorar legibilidad */
    #permission-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
    }
    
    #permission-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .permission-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
    }
    
    .permission-name {
      font-family: 'Marcellus', cursive;
      font-size: clamp(48px, 12vw, 80px);
      font-weight: 700;
      line-height: 1;
      color: #772620;
      text-align: center;
      margin-top: -70%;
    }
    
    .permission-text {
      font-family: "Abril Fatface", serif;
      font-size: clamp(18px, 4vw, 20px);
      font-weight: 700;
      color: #772620;
      text-align: center;
      animation: pulse 2.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% { 
        transform: scale(1); 
        opacity: 0.9; 
      }
      50% { 
        transform: scale(1.3); 
        opacity: 1; 
      }
    }

    .wrap{
      width:100%;
      max-width:520px;
      padding:24px 16px 28px;
      display:flex; 
      flex-direction:column; 
      gap:16px; 
      align-items:center;
      margin:0 auto;
    }
    
    .scene{ 
      perspective:1200px;
      width:100%; 
      display:grid; 
      place-items:center;
      contain: layout style;
      will-change: perspective;
    }
          
    .card{
      width:100%;
      max-width: var(--maxw);
      aspect-ratio: var(--img-ratio);
      background:#f6f1e9;
      overflow:hidden;
      border:1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      position:relative;
      margin-top: 8%;
      
      /* Optimización 3D */
      transform-style: preserve-3d;
      transform: translate3d(0,0,0) rotateX(0deg) rotateY(0deg);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      contain: paint;
      isolation: isolate;
    }

    .bg{
      position:absolute; 
      inset:0;
      width:100%; 
      height:100%;
      object-fit: cover;
      object-position: center;
      display:block;
      
      /* Optimización */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      will-change: transform;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    /* Efecto de brillo opcional */
    .card::after {
      content: "";
      position: absolute;
      inset: -50%;
      background: radial-gradient(
        ellipse at 50% 20%,
        rgba(255,255,255,0.25) 0%,
        transparent 60%
      );
      transform: translateZ(2px);
      pointer-events: none;
      mix-blend-mode: soft-light;
    }

    .cta{
      display:inline-block; 
      width: 80%;
      text-align:center; 
      background:#E9713F;
      font-family: "Marcellus", serif;
      color:#fff; 
      text-decoration:none;
      border-radius:12px; 
      padding:14px 16px; 
      font-weight:600; 
      letter-spacing:.2px;
      box-shadow:0 8px 20px rgba(0,0,0,.18);
      transform: translateZ(0);
      margin-top: 4%;
    }
    
    .hint{ 
      font-size:12px; 
      opacity:.65; 
      text-align:center; 
      margin-top:6px 
    }
    
    /* Clase para activar transformación suave */
    .card.smooth {
      transition: transform 0.08s cubic-bezier(0.23, 1, 0.32, 1);
    }
    
    @media (prefers-reduced-motion: reduce){
      .card{ transition:none !important; }
      .permission-text{ animation:none; }
    }
    
    /* Ajustes para móviles en landscape */
    @media (max-height: 500px) and (orientation: landscape) {
      .permission-name {
        font-size: clamp(36px, 8vw, 60px);
      }
      .permission-text {
        font-size: clamp(14px, 3vw, 20px);
      }
      .permission-content {
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL CON IMAGEN DE FONDO -->
  <div id="permission-overlay" role="button" tabindex="0" aria-label="Tocar para descubrir la invitación">
    <div class="permission-content">
      <div class="permission-name" id="permission-name">Invitado</div>
      <div class="permission-text">Toca para descubrir <br> tu invitación</div>
    </div>
  </div>

  <div class="wrap">
    <div class="scene">
      <div class="card" id="card">
        <img id="bg" class="bg" alt="Invitación" src="img/invitacion.PNG" loading="eager" />
      </div>
    </div>

    <a class="cta" id="cta" href="web.html" rel="noopener">Pulsa para ver los detalles y confirmar tu asistencia</a>
    <div class="hint" id="hint">Inclina el móvil para ver el efecto 3D.</div>
  </div>

  <script>
    // Personalización
    (function personalize(){
      const p = new URLSearchParams(location.search);
      const name = (p.get('n') || '').trim();
      
      document.getElementById('permission-name').textContent = name || 'Invitado';
      
      const ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', location.href.split('#')[0]);
    })();

    // ✅ SISTEMA DE MOVIMIENTO ULTRA-OPTIMIZADO
    (function tilt(){
      const card = document.getElementById('card');
      const hint = document.getElementById('hint');
      const permissionOverlay = document.getElementById('permission-overlay');

      // Detección de capacidades
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
      const inApp = /(instagram|fbav|fban|line|wechat|whatsapp)/i.test(navigator.userAgent);
      const isSecure = location.protocol === 'https:';
      const hasTouch = 'ontouchstart' in window;

      if (reduceMotion){ 
        hint.textContent = 'Movimiento reducido activado en tu dispositivo.'; 
        return; 
      }

      // ========== CONFIGURACIÓN OPTIMIZADA ==========
      const config = {
        maxTilt: 20,           
        smoothing: 0.12,       
        deadZone: 0.02,        
        gyroSensitivity: 35,   
        mouseSensitivity: 1.2, 
        shadowIntensity: 0.3,  
        updateThreshold: 0.01  
      };

      // Estado del movimiento
      let state = {
        currentX: 0,
        currentY: 0,
        targetX: 0,
        targetY: 0,
        velocityX: 0,
        velocityY: 0,
        beta0: null,
        gamma0: null,
        isGyroActive: false,
        rafId: null,
        lastUpdate: 0,
        isAnimating: false
      };

      // ========== MOTOR DE ANIMACIÓN OPTIMIZADO ==========
      function render(timestamp) {
        if (!state.isAnimating) return;
        
        const deltaTime = timestamp - state.lastUpdate;
        if (deltaTime < 16) {
          state.rafId = requestAnimationFrame(render);
          return;
        }
        state.lastUpdate = timestamp;

        const diffX = state.targetX - state.currentX;
        const diffY = state.targetY - state.currentY;
        
        state.velocityX = diffX * config.smoothing;
        state.velocityY = diffY * config.smoothing;
        
        state.currentX += state.velocityX;
        state.currentY += state.velocityY;
        
        if (Math.abs(state.velocityX) > config.updateThreshold || 
            Math.abs(state.velocityY) > config.updateThreshold) {
          
          const transform = `translate3d(0,0,0) rotateX(${state.currentY.toFixed(2)}deg) rotateY(${state.currentX.toFixed(2)}deg)`;
          card.style.transform = transform;
          
          const shadowOffset = Math.abs(state.currentX) + Math.abs(state.currentY);
          const shadowBlur = 20 + shadowOffset * 2;
          const shadowOpacity = 0.18 + (shadowOffset / 40) * config.shadowIntensity;
          card.style.boxShadow = `0 ${shadowBlur}px ${shadowBlur * 2}px rgba(0,0,0,${shadowOpacity})`;
        }
        
        if (Math.abs(diffX) > config.updateThreshold || Math.abs(diffY) > config.updateThreshold) {
          state.rafId = requestAnimationFrame(render);
        } else {
          state.isAnimating = false;
        }
      }

      function startAnimation() {
        if (!state.isAnimating) {
          state.isAnimating = true;
          state.rafId = requestAnimationFrame(render);
        }
      }

      function stopAnimation() {
        state.isAnimating = false;
        if (state.rafId) {
          cancelAnimationFrame(state.rafId);
          state.rafId = null;
        }
      }

      // ========== CONTROL POR MOUSE OPTIMIZADO ==========
      let mouseThrottleTimer = null;
      
      function handleMouseMove(e) {
        if (mouseThrottleTimer) return;
        
        mouseThrottleTimer = setTimeout(() => {
          mouseThrottleTimer = null;
        }, 16);

        const rect = card.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const normX = ((e.clientX - centerX) / (rect.width / 2)) * config.mouseSensitivity;
        const normY = ((e.clientY - centerY) / (rect.height / 2)) * config.mouseSensitivity;
        
        state.targetX = Math.max(-config.maxTilt, Math.min(config.maxTilt, normX * config.maxTilt));
        state.targetY = Math.max(-config.maxTilt, Math.min(config.maxTilt, -normY * config.maxTilt));
        
        startAnimation();
      }

      // ========== CONTROL TÁCTIL OPTIMIZADO ==========
      function handleTouch(e) {
        if (!e.touches || !e.touches[0]) return;
        
        const touch = e.touches[0];
        const rect = card.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const normX = ((touch.clientX - centerX) / (rect.width / 2));
        const normY = ((touch.clientY - centerY) / (rect.height / 2));
        
        state.targetX = Math.max(-config.maxTilt, Math.min(config.maxTilt, normX * config.maxTilt));
        state.targetY = Math.max(-config.maxTilt, Math.min(config.maxTilt, -normY * config.maxTilt));
        
        startAnimation();
      }

      function resetTilt() {
        state.targetX = 0;
        state.targetY = 0;
        startAnimation();
        
        setTimeout(() => {
          card.style.boxShadow = 'var(--shadow)';
        }, 300);
      }

      // ========== GIROSCOPIO OPTIMIZADO ==========
      let gyroThrottleTimer = null;
      
      function handleGyro(ev) {
        const { beta, gamma } = ev;
        if (beta === null || gamma === null) return;

        if (gyroThrottleTimer) return;
        gyroThrottleTimer = setTimeout(() => {
          gyroThrottleTimer = null;
        }, 20);

        if (state.beta0 === null) {
          state.beta0 = beta;
          state.gamma0 = gamma;
          hint.textContent = '¡Listo! Mueve el teléfono para ver el efecto 3D.';
          return;
        }

        const deltaBeta = (beta - state.beta0) / config.gyroSensitivity;
        const deltaGamma = (gamma - state.gamma0) / config.gyroSensitivity;
        
        if (Math.abs(deltaGamma) > config.deadZone) {
          state.targetX = Math.max(-1, Math.min(1, deltaGamma)) * config.maxTilt;
        }
        
        if (Math.abs(deltaBeta) > config.deadZone) {
          state.targetY = Math.max(-1, Math.min(1, -deltaBeta)) * config.maxTilt;
        }
        
        startAnimation();
      }

      function attachGyro() {
        if (state.isGyroActive) return;
        state.isGyroActive = true;
        window.addEventListener('deviceorientation', handleGyro, { passive: true });
      }

      // ========== EVENTOS ==========
      
      if (!hasTouch) {
        card.addEventListener('mouseenter', () => {
          card.classList.remove('smooth');
        }, { passive: true });
        
        card.addEventListener('mousemove', handleMouseMove, { passive: true });
        card.addEventListener('mouseleave', () => {
          card.classList.add('smooth');
          resetTilt();
        }, { passive: true });
      }

      if (hasTouch) {
        card.addEventListener('touchstart', (e) => {
          card.classList.remove('smooth');
          handleTouch(e);
        }, { passive: true });
        
        card.addEventListener('touchmove', handleTouch, { passive: true });
        
        card.addEventListener('touchend', () => {
          card.classList.add('smooth');
          resetTilt();
        }, { passive: true });
      }

      // ========== INICIALIZACIÓN ==========
      function initializeMotion() {
        permissionOverlay.classList.add('hidden');
        
        if (typeof DeviceOrientationEvent !== 'undefined') {
          if (typeof DeviceOrientationEvent.requestPermission === 'function' && isiOS) {
            DeviceOrientationEvent.requestPermission()
              .then(state => {
                if (state === 'granted') {
                  attachGyro();
                  hint.textContent = '¡Giroscopio activado! Mueve tu dispositivo.';
                } else {
                  hint.textContent = 'Usa el dedo para mover la tarjeta.';
                }
              })
              .catch(() => {
                hint.textContent = 'Usa el dedo para mover la tarjeta.';
              });
          } else {
            attachGyro();
          }
        }
        
        startAnimation();
        setTimeout(resetTilt, 100);
      }

      permissionOverlay.addEventListener('click', initializeMotion, { once: true });

      // ========== CALIBRACIÓN CON DOBLE TAP ==========
      let lastTap = 0;
      card.addEventListener('touchend', (e) => {
        const currentTime = Date.now();
        const tapLength = currentTime - lastTap;
        
        if (tapLength < 500 && tapLength > 0) {
          e.preventDefault();
          state.beta0 = null;
          state.gamma0 = null;
          hint.textContent = 'Calibración reiniciada.';
          
          if ('vibrate' in navigator) {
            navigator.vibrate(50);
          }
        }
        lastTap = currentTime;
      }, { passive: false });

      // ========== LIMPIEZA AL DESCARGAR ==========
      window.addEventListener('beforeunload', () => {
        stopAnimation();
        window.removeEventListener('deviceorientation', handleGyro);
      });

      // ========== OPTIMIZACIÓN PARA VISIBILIDAD ==========
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopAnimation();
        } else if (state.isGyroActive) {
          startAnimation();
        }
      });

    })();
  </script>
</body>
</html>
