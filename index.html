<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Invitación</title>
  <meta name="theme-color" content="#f6f1e9" />
  <meta name="description" content="Tarjeta de invitación. Pulsa para ver los detalles de la boda." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Invitación" />
  <meta property="og:description" content="Pulsa para ver todos los detalles de la boda." />
  <meta property="og:image" content="img/invitacion.PNG" />
  <meta property="og:url" content="" />

  <!-- Precargar imagen crítica -->
  <link rel="preload" as="image" href="img/invitacion.PNG" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --radius: 18px;
      --maxw: 420px;
      --shadow: 0 20px 50px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%; overflow-x:hidden;}
    body{
      margin:0;
      display:grid;
      place-items:center;
      background: #ffffff;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#E9713F;
      -webkit-font-smoothing:antialiased; 
      -moz-osx-font-smoothing:grayscale;
    }
    
    /* --- PANTALLA INICIAL DE PERMISO --- */
    #permission-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity .5s ease, visibility .5s ease;
      -webkit-tap-highlight-color: transparent;
      will-change: opacity;
    }
    #permission-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .permission-name {
      font-family: 'Amatic SC', cursive;
      font-size: clamp(40px, 10vw, 64px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 4px;
      color: #000000;
      text-shadow: 3px 4px 10px rgba(0,0,0,0.65);
      text-align: center;
      margin-top: 40%;
    }
    .permission-text {
      font-family: "Playfair Display", serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700;
      color: #E9713F;
      padding: 20px;
      text-align: center;
      animation: pulse 2.5s infinite ease-in-out;
      margin-top: -90%;
      will-change: transform;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.95; }
    }

    .wrap{
      width:100%;
      max-width:520px;
      padding:24px 16px 28px;
      display:flex; 
      flex-direction:column; 
      gap:16px; 
      align-items:center;
      margin:0 auto;
    }
    
    .scene{ 
      perspective:1200px; /* Aumentado para mejor efecto 3D */
      width:100%; 
      display:grid; 
      place-items:center;
      /* Contenedor optimizado */
      contain: layout style;
      will-change: perspective;
    }
    
    .card{
      width:100%;
      max-width: var(--maxw);
      aspect-ratio: 2 / 3;
      background:#f6f1e9;
      border-radius: var(--radius);
      overflow:hidden;
      border:1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      position:relative;
      
      /* Optimización 3D crítica */
      transform-style: preserve-3d;
      transform: translate3d(0,0,0) rotateX(0deg) rotateY(0deg);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      
      /* Transición desactivada para usar JS */
      transition: none;
      
      /* Forzar GPU */
      -webkit-transform: translate3d(0,0,0);
      -webkit-perspective: 1000;
      
      /* Contención para mejor rendimiento */
      contain: paint;
    }
    
    /* Brillo optimizado con GPU */
    .card::after{
      content:"";
      position:absolute; 
      inset:-40%;
      background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.22), transparent 60%);
      transform: translate3d(0, 0, 40px);
      pointer-events:none;
      mix-blend-mode:soft-light;
      will-change: transform;
    }
    
    .bg{
      position:absolute; 
      inset:0;
      width:100%; 
      height:100%;
      object-fit:cover; 
      object-position:center;
      display:block;
      /* Optimización de imagen */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      will-change: transform;
      transform: translateZ(0);
    }
    
    .guest{
      position:absolute;
      top: 62%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(2px);
      width: 90%;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700;
      font-size: clamp(22px, 6vw, 34px);
      letter-spacing: .2px;
      line-height:1.1;
      pointer-events:none;
      white-space: normal;
      word-break: break-word;
      will-change: transform;
    }
    
    .cta{
      display:inline-block; 
      width:100%;
      text-align:center; 
      background:#E9713F; 
      color:#fff; 
      text-decoration:none;
      padding:14px 16px; 
      border-radius:12px; 
      font-weight:600; 
      letter-spacing:.2px;
      box-shadow:0 8px 20px rgba(0,0,0,.18);
      transform: translateZ(0); /* GPU acceleration */
    }
    
    .hint{ 
      font-size:12px; 
      opacity:.65; 
      text-align:center; 
      margin-top:6px 
    }
    
    /* Clase para activar transformación suave */
    .card.smooth {
      transition: transform 0.08s cubic-bezier(0.23, 1, 0.32, 1);
    }
    
    @media (prefers-reduced-motion: reduce){
      .card{ transition:none !important; }
      .permission-text{ animation:none; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL DE PERMISOS CON NOMBRE DINÁMICO -->
  <div id="permission-overlay" role="button" tabindex="0" aria-label="Tocar para descubrir la invitación">
    <div class="permission-name" id="permission-name">Invitado</div>
    <div class="permission-text">Toca para descubrir la invitación</div>
  </div>

  <div class="wrap">
    <div class="scene">
      <div class="card" id="card">
        <img id="bg" class="bg" alt="Invitación" src="img/invitacion.PNG" loading="eager" />
      </div>
    </div>

    <a class="cta" id="cta" href="web.html" rel="noopener">Pulsa para acceder a la página web de la boda y ver todos los detalles</a>
    <div class="hint" id="hint">Inclina el móvil para ver el efecto 3D.</div>
  </div>

  <script>
    // Personalización
    (function personalize(){
      const p = new URLSearchParams(location.search);
      const name = (p.get('n') || '').trim();
      
      document.getElementById('permission-name').textContent = name || 'Invitado';
      
      const ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', location.href.split('#')[0]);
    })();

    // ✅ SISTEMA DE MOVIMIENTO ULTRA-OPTIMIZADO
    (function tilt(){
      const card = document.getElementById('card');
      const hint = document.getElementById('hint');
      const permissionOverlay = document.getElementById('permission-overlay');

      // Detección de capacidades
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
      const inApp = /(instagram|fbav|fban|line|wechat|whatsapp)/i.test(navigator.userAgent);
      const isSecure = location.protocol === 'https:';
      const hasTouch = 'ontouchstart' in window;

      if (reduceMotion){ 
        hint.textContent = 'Movimiento reducido activado en tu dispositivo.'; 
        return; 
      }

      // ========== CONFIGURACIÓN OPTIMIZADA ==========
      const config = {
        maxTilt: 20,           // Máximo ángulo de inclinación
        smoothing: 0.12,       // Factor de suavizado (0.1-0.2 es ideal)
        deadZone: 0.02,        // Zona muerta mínima
        gyroSensitivity: 35,   // Sensibilidad del giroscopio
        mouseSensitivity: 1.2, // Multiplicador para mouse
        shadowIntensity: 0.3,  // Intensidad de la sombra dinámica
        updateThreshold: 0.01  // Umbral mínimo de actualización
      };

      // Estado del movimiento
      let state = {
        currentX: 0,
        currentY: 0,
        targetX: 0,
        targetY: 0,
        velocityX: 0,
        velocityY: 0,
        beta0: null,
        gamma0: null,
        isGyroActive: false,
        rafId: null,
        lastUpdate: 0,
        isAnimating: false
      };

      // ========== MOTOR DE ANIMACIÓN OPTIMIZADO ==========
      function render(timestamp) {
        if (!state.isAnimating) return;
        
        // Limitar FPS a 60
        const deltaTime = timestamp - state.lastUpdate;
        if (deltaTime < 16) {
          state.rafId = requestAnimationFrame(render);
          return;
        }
        state.lastUpdate = timestamp;

        // Calcular diferencias
        const diffX = state.targetX - state.currentX;
        const diffY = state.targetY - state.currentY;
        
        // Aplicar suavizado con física simple
        state.velocityX = diffX * config.smoothing;
        state.velocityY = diffY * config.smoothing;
        
        state.currentX += state.velocityX;
        state.currentY += state.velocityY;
        
        // Aplicar transformación solo si hay cambio significativo
        if (Math.abs(state.velocityX) > config.updateThreshold || 
            Math.abs(state.velocityY) > config.updateThreshold) {
          
          // Usar transform3d para forzar GPU
          const transform = `translate3d(0,0,0) rotateX(${state.currentY.toFixed(2)}deg) rotateY(${state.currentX.toFixed(2)}deg)`;
          card.style.transform = transform;
          
          // Actualizar sombra dinámicamente (opcional, comentar si afecta rendimiento)
          const shadowOffset = Math.abs(state.currentX) + Math.abs(state.currentY);
          const shadowBlur = 20 + shadowOffset * 2;
          const shadowOpacity = 0.18 + (shadowOffset / 40) * config.shadowIntensity;
          card.style.boxShadow = `0 ${shadowBlur}px ${shadowBlur * 2}px rgba(0,0,0,${shadowOpacity})`;
        }
        
        // Continuar animación si no está en reposo
        if (Math.abs(diffX) > config.updateThreshold || Math.abs(diffY) > config.updateThreshold) {
          state.rafId = requestAnimationFrame(render);
        } else {
          state.isAnimating = false;
        }
      }

      function startAnimation() {
        if (!state.isAnimating) {
          state.isAnimating = true;
          state.rafId = requestAnimationFrame(render);
        }
      }

      function stopAnimation() {
        state.isAnimating = false;
        if (state.rafId) {
          cancelAnimationFrame(state.rafId);
          state.rafId = null;
        }
      }

      // ========== CONTROL POR MOUSE OPTIMIZADO ==========
      let mouseThrottleTimer = null;
      
      function handleMouseMove(e) {
        // Throttling para reducir cálculos
        if (mouseThrottleTimer) return;
        
        mouseThrottleTimer = setTimeout(() => {
          mouseThrottleTimer = null;
        }, 16); // ~60fps

        const rect = card.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        // Calcular posición normalizada desde el centro
        const normX = ((e.clientX - centerX) / (rect.width / 2)) * config.mouseSensitivity;
        const normY = ((e.clientY - centerY) / (rect.height / 2)) * config.mouseSensitivity;
        
        // Aplicar límites y asignar
        state.targetX = Math.max(-config.maxTilt, Math.min(config.maxTilt, normX * config.maxTilt));
        state.targetY = Math.max(-config.maxTilt, Math.min(config.maxTilt, -normY * config.maxTilt));
        
        startAnimation();
      }

      // ========== CONTROL TÁCTIL OPTIMIZADO ==========
      function handleTouch(e) {
        if (!e.touches || !e.touches[0]) return;
        
        const touch = e.touches[0];
        const rect = card.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const normX = ((touch.clientX - centerX) / (rect.width / 2));
        const normY = ((touch.clientY - centerY) / (rect.height / 2));
        
        state.targetX = Math.max(-config.maxTilt, Math.min(config.maxTilt, normX * config.maxTilt));
        state.targetY = Math.max(-config.maxTilt, Math.min(config.maxTilt, -normY * config.maxTilt));
        
        startAnimation();
      }

      function resetTilt() {
        state.targetX = 0;
        state.targetY = 0;
        startAnimation();
        
        // Restaurar sombra después de un pequeño delay
        setTimeout(() => {
          card.style.boxShadow = 'var(--shadow)';
        }, 300);
      }

      // ========== GIROSCOPIO OPTIMIZADO ==========
      let gyroThrottleTimer = null;
      
      function handleGyro(ev) {
        const { beta, gamma } = ev;
        if (beta === null || gamma === null) return;

        // Throttling del giroscopio
        if (gyroThrottleTimer) return;
        gyroThrottleTimer = setTimeout(() => {
          gyroThrottleTimer = null;
        }, 20); // 50fps para giroscopio

        // Calibración inicial
        if (state.beta0 === null) {
          state.beta0 = beta;
          state.gamma0 = gamma;
          hint.textContent = '¡Listo! Mueve el teléfono para ver el efecto 3D.';
          return;
        }

        // Calcular deltas con sensibilidad
        const deltaBeta = (beta - state.beta0) / config.gyroSensitivity;
        const deltaGamma = (gamma - state.gamma0) / config.gyroSensitivity;
        
        // Aplicar zona muerta y límites
        if (Math.abs(deltaGamma) > config.deadZone) {
          state.targetX = Math.max(-1, Math.min(1, deltaGamma)) * config.maxTilt;
        }
        
        if (Math.abs(deltaBeta) > config.deadZone) {
          state.targetY = Math.max(-1, Math.min(1, -deltaBeta)) * config.maxTilt;
        }
        
        startAnimation();
      }

      function attachGyro() {
        if (state.isGyroActive) return;
        state.isGyroActive = true;
        window.addEventListener('deviceorientation', handleGyro, { passive: true });
      }

      // ========== EVENTOS ==========
      
      // Mouse events con passive para mejor scrolling
      if (!hasTouch) {
        card.addEventListener('mouseenter', () => {
          card.classList.remove('smooth');
        }, { passive: true });
        
        card.addEventListener('mousemove', handleMouseMove, { passive: true });
        card.addEventListener('mouseleave', () => {
          card.classList.add('smooth');
          resetTilt();
        }, { passive: true });
      }

      // Touch events
      if (hasTouch) {
        card.addEventListener('touchstart', (e) => {
          card.classList.remove('smooth');
          handleTouch(e);
        }, { passive: true });
        
        card.addEventListener('touchmove', handleTouch, { passive: true });
        
        card.addEventListener('touchend', () => {
          card.classList.add('smooth');
          resetTilt();
        }, { passive: true });
      }

      // ========== INICIALIZACIÓN ==========
      function initializeMotion() {
        permissionOverlay.classList.add('hidden');
        
        // Intentar activar giroscopio
        if (typeof DeviceOrientationEvent !== 'undefined') {
          if (typeof DeviceOrientationEvent.requestPermission === 'function' && isiOS) {
            DeviceOrientationEvent.requestPermission()
              .then(state => {
                if (state === 'granted') {
                  attachGyro();
                  hint.textContent = '¡Giroscopio activado! Mueve tu dispositivo.';
                } else {
                  hint.textContent = 'Usa el dedo para mover la tarjeta.';
                }
              })
              .catch(() => {
                hint.textContent = 'Usa el dedo para mover la tarjeta.';
              });
          } else {
            // Android o desktop con giroscopio
            attachGyro();
          }
        }
        
        // Precalentar la animación
        startAnimation();
        setTimeout(resetTilt, 100);
      }

      // Evento principal
      permissionOverlay.addEventListener('click', initializeMotion, { once: true });

      // ========== CALIBRACIÓN CON DOBLE TAP ==========
      let lastTap = 0;
      card.addEventListener('touchend', (e) => {
        const currentTime = Date.now();
        const tapLength = currentTime - lastTap;
        
        if (tapLength < 500 && tapLength > 0) {
          e.preventDefault();
          // Reiniciar calibración
          state.beta0 = null;
          state.gamma0 = null;
          hint.textContent = 'Calibración reiniciada.';
          
          // Vibración suave si está disponible
          if ('vibrate' in navigator) {
            navigator.vibrate(50);
          }
        }
        lastTap = currentTime;
      }, { passive: false });

      // ========== LIMPIEZA AL DESCARGAR ==========
      window.addEventListener('beforeunload', () => {
        stopAnimation();
        window.removeEventListener('deviceorientation', handleGyro);
      });

      // ========== OPTIMIZACIÓN PARA VISIBILIDAD ==========
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopAnimation();
        } else if (state.isGyroActive) {
          startAnimation();
        }
      });

    })();
  </script>
</body>
</html>
